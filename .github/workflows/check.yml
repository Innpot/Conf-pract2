name: Check
on: [push, pull_request, workflow_dispatch]

jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m src.main --config examples/diamond.ini
      - run: python -m src.main --config examples/cycle.ini --order
  ubuntu-comparison:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compare with native APT on Ubuntu 24.04
        run: sh scripts/compare-apt.sh hello sed jq
